<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ring Rotator</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #fff; color: #000;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.25rem; padding: 1rem;
    -webkit-user-select: none; user-select: none;
  }
  #sphere { touch-action: none; cursor: grab; }
  #sphere.dragging { cursor: grabbing; }
  #readout { font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .buttons { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; align-items: center; }
  .buttons .lbl { font-size: .85rem; color: #888; width: 4rem; text-align: right; }
  .buttons button {
    font: inherit; font-size: 1rem; padding: .35rem 1.1rem;
    background: #ffffff; color: #000; border-radius: 20px;
    cursor: pointer; border: none;
    box-shadow: 0 0 0 1px #ddd;
  }
  .buttons button:active { background: #dcdcdc; color: #000; }
  #send { background: #4172ff; color: #fff; padding: .6rem 1.8rem; font-size: 1.1rem;
          border: none; border-radius: 20px; cursor: pointer; }
  #send:active { background: #2c53cc; }
  #status { min-height: 1.2em; font-size: .85rem; color: #888; }
  #status.err { color: #c00; }
  .nav { font-size: .85rem; color: #888; text-decoration: none; }
</style>
</head>
<body>

<canvas id="sphere"></canvas>
<div id="readout"></div>

<div class="buttons">
  <span class="lbl">polar</span>
  <button data-axis="polar" data-delta="-90">-90&deg;</button>
  <button data-axis="polar" data-delta="-45">-45&deg;</button>
  <button data-axis="polar" data-delta="45">+45&deg;</button>
  <button data-axis="polar" data-delta="90">+90&deg;</button>
</div>
<div class="buttons">
  <span class="lbl">azimuth</span>
  <button data-axis="azimuth" data-delta="-90">-90&deg;</button>
  <button data-axis="azimuth" data-delta="-45">-45&deg;</button>
  <button data-axis="azimuth" data-delta="45">+45&deg;</button>
  <button data-axis="azimuth" data-delta="90">+90&deg;</button>
</div>
<button id="send">Send</button>

<div id="status"></div>
<a class="nav" href="/camera">camera &rarr;</a>

<script>
const canvas = document.getElementById('sphere');
const ctx = canvas.getContext('2d');
const readout = document.getElementById('readout');
const statusEl = document.getElementById('status');

// polar: elevation on the sphere (-180..180, 0 = front, +90 = top)
// azimuth: orbit around the vertical axis (-180..180, 0 = right limb, +90 = back)
let polar = 0, azimuth = 0;
let dragging = false, startX = 0, startY = 0, startPolar = 0, startAzimuth = 0;
const DEG_PER_PX = 0.6;

let R = 0, CX = 0, CY = 0;

function normalize(a) {
  a = ((a % 360) + 360) % 360;   // [0, 360)
  return a > 180 ? a - 360 : a;  // (-180, 180]
}

// (elevation, azimuth) degrees -> unit sphere; +x right, +y screen-down, +z toward viewer
// azimuth is shifted +90 so that 0 sits on the right limb of the sphere
function pt(el, az) {
  const e = el * Math.PI / 180, a = (az + 90) * Math.PI / 180;
  const c = Math.cos(e);
  return { x: c * Math.sin(a), y: -Math.sin(e), z: c * Math.cos(a) };
}

function drawPath(pts, frontWidth, backWidth) {
  for (let i = 0; i < pts.length - 1; i++) {
    const p = pts[i], q = pts[i + 1];
    const front = (p.z + q.z) / 2 >= 0;
    ctx.strokeStyle = front ? '#000' : '#ccc';
    ctx.lineWidth = front ? frontWidth : backWidth;
    ctx.beginPath();
    ctx.moveTo(CX + p.x * R, CY + p.y * R);
    ctx.lineTo(CX + q.x * R, CY + q.y * R);
    ctx.stroke();
  }
}

function render() {
  ctx.clearRect(0, 0, CX * 2, CY * 2);

  // latitude circles every 15deg
  for (let el = -75; el <= 75; el += 15) {
    const pts = [];
    for (let a = 0; a <= 360; a += 4) pts.push(pt(el, a));
    drawPath(pts, 1, 1);
  }
  // longitude circles every 30deg
  for (let az = 0; az < 360; az += 30) {
    const pts = [];
    for (let el = -90; el <= 90; el += 4) pts.push(pt(el, az));
    drawPath(pts, 1, 1);
  }
  // sphere outline
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.stroke();

  // the physical ring = meridian at the current azimuth, drawn heavier
  const ringPts = [];
  for (let el = -90; el <= 90; el += 3) ringPts.push(pt(el, azimuth));
  drawPath(ringPts, 3, 1.5);

  // marker
  const m = pt(polar, azimuth);
  const mr = R * 0.05 * (0.75 + 0.25 * m.z);
  ctx.beginPath();
  ctx.arc(CX + m.x * R, CY + m.y * R, mr, 0, Math.PI * 2);
  if (m.z >= 0) {
    ctx.fillStyle = '#000';
    ctx.fill();
  } else {
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  readout.textContent = `polar ${Math.round(polar)}°   azimuth ${Math.round(azimuth)}°`;
}

function resize() {
  const size = Math.min(window.innerWidth * 0.75, window.innerHeight * 0.45);
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = canvas.style.height = size + 'px';
  canvas.width = canvas.height = Math.round(size * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  CX = CY = size / 2;
  R = size * 0.44;
  render();
}

canvas.addEventListener('pointerdown', e => {
  dragging = true;
  startX = e.clientX; startY = e.clientY;
  startPolar = polar; startAzimuth = azimuth;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  azimuth = normalize(startAzimuth + (e.clientX - startX) * DEG_PER_PX);
  polar = normalize(startPolar - (e.clientY - startY) * DEG_PER_PX);
  render();
});
canvas.addEventListener('pointerup', () => {
  dragging = false;
  canvas.classList.remove('dragging');
});
canvas.addEventListener('pointercancel', () => {
  dragging = false;
  canvas.classList.remove('dragging');
});

document.querySelectorAll('.buttons button[data-axis]').forEach(b =>
  b.addEventListener('click', () => {
    const d = parseFloat(b.dataset.delta);
    if (b.dataset.axis === 'polar') polar = normalize(polar + d);
    else azimuth = normalize(azimuth + d);
    render();
  }));

document.getElementById('send').addEventListener('click', send);

async function send() {
  statusEl.textContent = 'sending…';
  statusEl.className = '';
  try {
    const r = await fetch('/api/rotate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ polar, azimuth }),
    });
    const j = await r.json();
    if (j.error || !j.ok) {
      statusEl.textContent = j.error || j.response || 'failed';
      statusEl.className = 'err';
    } else {
      statusEl.textContent = 'OK';
    }
  } catch {
    statusEl.textContent = 'server unreachable';
    statusEl.className = 'err';
  }
}

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
