<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #fff; color: #000;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1rem; padding: 1rem;
  }
  img { max-width: 100%; max-height: 75vh; background: #eee; }
  a, #status { font-size: .85rem; color: #888; text-decoration: none; }
  #status { min-height: 1.2em; }
  #controls {
    display: flex; flex-direction: column; gap: .4rem;
    font-size: .85rem; color: #444;
  }
  #controls label { display: flex; align-items: center; gap: .6rem; }
  #controls input[type="range"] { width: 12rem; }
  #controls .val { width: 5.5rem; font-variant-numeric: tabular-nums; }
  #controls.hidden { display: none; }
  #controls .hidden { display: none; }
  #controls.disabled input[type="range"] { opacity: .35; }
  #hist { max-width: 100%; background: #fafafa; }
  .btn-row { display: flex; align-items: center; }
  #capture, #calibrate {
    font: inherit; font-size: .85rem; padding: 1rem 1rem; margin-top: .2rem;
    background: #fff; border-radius: 20px; cursor: pointer;
    box-shadow: 0 0 2px 3px #cbcbcb; border: none;
  }
  #capture { margin: 0 auto; }
  #calibrate svg, #capture svg { display: block; }
  #capture:active, #calibrate:active { background: #dcdcdc; }
</style>
</head>
<body>

<img id="cam" src="/api/stream" alt="live camera feed">
<div class="btn-row">
  <button id="calibrate" type="button" aria-label="calibrate">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.4" fill="#fff"/>
      <line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2.4" fill="#fff"/>
      <line x1="4" y1="17" x2="20" y2="17"/><circle cx="7" cy="17" r="2.4" fill="#fff"/>
    </svg>
  </button>
  <button id="capture" type="button"></button>
  <button id="images" type="button"></button>
</div>
<canvas id="hist" width="512" height="140"></canvas>
<div id="status"></div>

<div id="controls" class="hidden">
  <label>
    <input id="ae" type="checkbox" checked> auto exposure
  </label>
  <label>
    <input id="awb" type="checkbox" checked> auto white balance
  </label>
  <label>
    exposure
    <input id="exp" type="range" min="0" max="100" value="50">
    <span class="val" id="expVal"></span>
  </label>
  <label>
    gain
    <input id="gain" type="range" min="1" max="16" step="0.1" value="1">
    <span class="val" id="gainVal"></span>
  </label>
</div>

<a href="/">&larr; controls</a>

<script>
  const cam = document.getElementById('cam');
  cam.addEventListener('error', () =>
    document.getElementById('status').textContent = 'camera stream unavailable');

  // keep the button row the same width as the camera image
  new ResizeObserver(() => {
    document.querySelector('.btn-row').style.width = cam.clientWidth + 'px';
  }).observe(cam);

  const ae = document.getElementById('ae');
  const awb = document.getElementById('awb');
  const exp = document.getElementById('exp');
  const gain = document.getElementById('gain');
  const expVal = document.getElementById('expVal');
  const gainVal = document.getElementById('gainVal');
  const controls = document.getElementById('controls');

  // log scale: slider 0..100 -> 100us .. 100ms
  const expUs = () => Math.round(100 * Math.pow(1000, exp.value / 100));
  const expUsFrom = us =>
    Math.round(Math.log10(us / 100) / 3 * 100);

  function fmtExp(us) {
    return us < 1000 ? us + ' \u00b5s' : (us / 1000).toFixed(2) + ' ms';
  }

  function showValues() {
    expVal.textContent = fmtExp(expUs());
    gainVal.textContent = 'x' + Number(gain.value).toFixed(1);
    controls.classList.toggle('disabled', ae.checked);
    exp.disabled = gain.disabled = ae.checked;
  }

  async function send() {
    try {
      await fetch('/api/camera-settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          awb: awb.checked,
          ...(ae.checked ? { ae: true }
                         : { ae: false, exposure_us: expUs(),
                             gain: Number(gain.value) }),
        }),
      });
    } catch { /* ignore: slider drags are best-effort */ }
  }

  ae.addEventListener('change', () => { showValues(); send(); });
  awb.addEventListener('change', send);
  exp.addEventListener('input', showValues);
  exp.addEventListener('change', send);
  gain.addEventListener('input', showValues);
  gain.addEventListener('change', send);

  document.getElementById('calibrate').addEventListener('click', () =>
    controls.classList.toggle('hidden'));

  fetch('/api/camera-settings').then(r => r.json()).then(s => {
    if (s.error) { controls.classList.add('hidden'); return; }
    ae.checked = s.ae !== false;
    awb.checked = s.awb !== false;
    if (s.exposure_us) exp.value = expUsFrom(s.exposure_us);
    if (s.gain) gain.value = s.gain;
    showValues();
  }).catch(() => {});
  showValues();

  // --- raw channel histogram, refreshed from /api/histogram ---
  const hist = document.getElementById('hist');
  const hctx = hist.getContext('2d');

  function drawHist(d) {
    const W = hist.width, H = hist.height, AXIS = 16;  // bottom strip for ticks
    hctx.clearRect(0, 0, W, H);
    hctx.fillStyle = '#888';
    hctx.font = '10px system-ui';
    const n = d.r.length, clip = n - 1;
    hctx.fillText(`raw ${d.pattern}, ${d.bit_depth}-bit (log counts)`, 4, 10);
    hctx.fillStyle = '#d00';
    hctx.fillText(`clip ${clip}:  r=${d.r[clip]}  g=${d.g[clip]}  b=${d.b[clip]}`,
                  W - 200, 10);
    const max = Math.log10(1 + Math.max(...d.r, ...d.g, ...d.b));
    for (const [key, color] of [['r', '#d00'], ['g', '#0a0'], ['b', '#00d']]) {
      const v = d[key];
      hctx.strokeStyle = color;
      hctx.beginPath();
      v.forEach((c, i) => {
        const x = i / (v.length - 1) * W;
        const y = H - AXIS - (c ? Math.log10(1 + c) / max * (H - AXIS - 16) : 0);
        i ? hctx.lineTo(x, y) : hctx.moveTo(x, y);
      });
      hctx.stroke();
    }
    // x axis: tick + label every quarter of the bin range
    hctx.strokeStyle = '#ccc'; hctx.fillStyle = '#888';
    hctx.beginPath();
    for (let t = 0; t <= 4; t++) {
      const bin = Math.round(t * clip / 4);
      const x = bin / clip * W;
      hctx.moveTo(x, H - AXIS); hctx.lineTo(x, H - AXIS + 3);
      hctx.fillText(bin, Math.min(x + 2, W - 24), H - 4);
    }
    hctx.stroke();
    // dashed guide at the clip bin
    hctx.strokeStyle = '#ccc';
    hctx.setLineDash([3, 3]);
    hctx.beginPath();
    hctx.moveTo(W - 1, 12); hctx.lineTo(W - 1, H - AXIS);
    hctx.stroke();
    hctx.setLineDash([]);
  }

  function pollHist() {
    fetch('/api/histogram').then(r => r.ok ? r.json() : null)
      .then(d => { if (d) drawHist(d); }).catch(() => {});
    setTimeout(pollHist, 1500);
  }
  pollHist();

  document.getElementById('capture').addEventListener('click', async () => {
    const status = document.getElementById('status');
    try {
      const j = await fetch('/api/capture', { method: 'POST' })
        .then(r => r.json());
      status.textContent = j.ok ? 'saved ' + j.path
                                : (j.error || 'capture failed');
    } catch {
      status.textContent = 'capture failed';
    }
  });
</script>
</body>
</html>
